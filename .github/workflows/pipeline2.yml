name: Pipeline 2 - Digital Factory

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Récupération du code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Analyse qualité SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 3. Connexion à Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS2 }}

      # 4. Connexion au registre ACR
      - name: Login to ACR
        run: |
          az acr login --name acrehtp2026 --resource-group rg-digital-factory

      # 5. Build de l’image Docker (avec version Python en argument)
      - name: Build Docker Image
        run: |
          docker build -t pharmalink:latest --build-arg PYTHON_VERSION=3.12-slim .
          docker tag pharmalink:latest acrehtp2026.azurecr.io/app:${{ github.sha }}

      # 6. Scan de l’image avec Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pharmalink:latest
          format: table
          exit-code: '0'   # Continue même si vulnérabilités
          severity: CRITICAL

      # 7. Push de l’image vers ACR (uniquement si succès)
      - name: Push Docker Image
        if: success()
        run: |
          docker push acrehtp2026.azurecr.io/app:${{ github.sha }}

      # 8. Déploiement et redémarrage de l’application Web
      - name: Deploy and Restart Web App
        run: |
          az webapp config container set \
            --name app-df-ehttp-emc \
            --resource-group rg-digital-factory \
            --container-image-name acrehtp2026.azurecr.io/app:${{ github.sha }} \
            --container-registry-url https://acrehtp2026.azurecr.io
          az webapp restart \
            --resource-group rg-digital-factory \
            --name app-df-ehttp-emc
